name: Deploy to mock-ekstern
run-name: Deploy '${{ github.ref_name }}' to 'mock'

on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build and deploy to NAIS
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # ratchet:pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install dependencies
        run: |
          pnpm config set @navikt:registry https://registry.npmjs.org/
          pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test --runInBand
      - name: Build
        run: pnpm build
      - uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: medlemskap
          dockerfile: Dockerfile
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais.yaml
          VAR: image=${{ steps.docker-push.outputs.image }}
